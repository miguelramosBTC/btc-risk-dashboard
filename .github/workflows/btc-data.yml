# .github/workflows/btc-data.yml
# Daily: recompute the v2 risk model on fresh Coin Metrics data and publish data.json + data.js.
# This is what makes the dashboard and the email engine fully autonomous — no manual rebuilds.
#
# Runs at 06:00 UTC, two hours before the email engine's 08:00 cron, so the data is fresh when
# notifications go out. The dashboard loads the data from jsDelivr and the email engine from raw
# GitHub, so this commit does NOT trigger a Netlify redeploy (netlify.toml ignores data-only
# commits); the purge step below refreshes the CDN. The daily commit also doubles as a keep-alive
# so GitHub never auto-disables the schedule.
#
# No secrets needed: the Coin Metrics community CSV is public.

name: Refresh risk data (daily)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}          # lets you trigger a refresh by hand

permissions:
  contents: write                # allows committing data.json / data.js

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Compute risk and emit data.json + data.js
        run: python3 btc_risk_model_v2.py      # BTC_LAST_DATE unset -> computes through the latest CSV row
      - name: Commit data if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.js
          if git diff --staged --quiet; then
            echo "No data change today."
          else
            git commit -m "data: daily risk refresh ($(date -u +%F))"
            git push
            echo "Published fresh data.json + data.js."
          fi
      - name: Refresh jsDelivr CDN (so the dashboard picks up new data within minutes)
        continue-on-error: true        # a purge hiccup must never fail the data job
        run: |
          base="https://purge.jsdelivr.net/gh/miguelramosBTC/btc-risk-dashboard@main"
          curl -s "$base/data.js"   >/dev/null || true
          curl -s "$base/data.json" >/dev/null || true
          echo "Requested jsDelivr cache purge."
