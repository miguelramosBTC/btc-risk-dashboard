# repo path: .github/workflows/x-daily-post.yml
# Daily: post the risk reading to X, 75 min after the 06:00 UTC data refresh
# commits fresh data.json — so the checkout below always contains today's
# canonical numbers and the post can never disagree with the dashboard.
#
# v2: long-form satirical post (needs X Premium on the bot account; auto-
# degrades to the short format if rejected), gauge image attached via the
# v2 media endpoints, Grok (api.x.ai Responses API + live x_search/web_search)
# as the default LLM. This workflow commits nothing — no Pages builds used.
#
# Cost (verified 2026): $0.015 per post (text/media, no URL in the text).
# The script blocks URLs in the post text ($0.20 tier); bio carries the link.
#
# Modes:
#   * Repo variable BOT_DRY_RUN — "true" (draft to run log + job summary) /
#     "false" (live). UNSET behaves as "true": nothing posts by accident.
#   * Manual runs (workflow_dispatch) can override with the dry_run input.
#
# Secrets: X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET,
# LLM_API_KEY (xAI console key for Grok, or DeepSeek). See bot/README.md.

name: Daily X post (risk bot)

on:
  schedule:
    - cron: "15 7 * * *"         # 07:15 UTC — data job (06:00) has finished
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print the post, do not publish)"
        type: boolean
        default: true

permissions:
  contents: read                 # the bot only READS data.json; no commits

concurrency:
  group: x-daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot deps
        run: pip install -r bot/requirements.txt

      - name: Compose and post daily risk update
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LLM_API_KEY:           ${{ secrets.LLM_API_KEY }}
          # optional overrides via repo Variables (safe defaults in the script)
          LLM_BASE_URL:          ${{ vars.LLM_BASE_URL }}
          LLM_MODEL:             ${{ vars.LLM_MODEL }}
          LLM_TEMPERATURE:       ${{ vars.LLM_TEMPERATURE }}
          GROK_SEARCH:           ${{ vars.GROK_SEARCH }}
          TWEET_MODE:            ${{ vars.TWEET_MODE }}
          ATTACH_GAUGE:          ${{ vars.ATTACH_GAUGE }}
          LONG_MIN_WORDS:        ${{ vars.LONG_MIN_WORDS }}
          LONG_MAX_WORDS:        ${{ vars.LONG_MAX_WORDS }}
          MAX_LONG_CHARS:        ${{ vars.MAX_LONG_CHARS }}
          EVENT_NAME:            ${{ github.event_name }}
          INPUT_DRY_RUN:         ${{ inputs.dry_run }}
          VAR_DRY_RUN:           ${{ vars.BOT_DRY_RUN }}
        run: |
          # Resolve dry-run: manual input wins on dispatch; otherwise the repo
          # variable; otherwise SAFE DEFAULT = dry-run.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_DRY_RUN" ]; then
            export BOT_DRY_RUN="$INPUT_DRY_RUN"
          elif [ -n "$VAR_DRY_RUN" ]; then
            export BOT_DRY_RUN="$VAR_DRY_RUN"
          else
            export BOT_DRY_RUN="true"
          fi
          echo "BOT_DRY_RUN=$BOT_DRY_RUN"
          python3 bot/post_risk_update.py
