# netlify.toml — bitcoinrisk.net
#
# Serves index.html (repo root) as a static site and bundles netlify/functions/:
#   subscribe.mjs        POST  /.netlify/functions/subscribe     (double opt-in signup)
#   confirm.mjs          GET   /.netlify/functions/confirm        (activates a subscriber)
#   unsubscribe.mjs      GET/POST /.netlify/functions/unsubscribe (one-click unsubscribe)
#   suggest.mjs          POST  /.netlify/functions/suggest        (stores a suggestion)
#   send-notifications.mjs  (scheduled, daily 08:00 UTC — declared via export const config)
#
# Env (Site settings -> Environment variables):
#   SUPABASE_URL                 https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    the SERVICE ROLE key (server-only; bypasses RLS)
#   RESEND_API_KEY               re_...   (bitcoinrisk.net Resend account)
#   EMAIL_FROM                   BitcoinRisk <alerts@bitcoinrisk.net>  (verified domain)
#   SITE_URL                     https://bitcoinrisk.net
#   COINGECKO_API_KEY            optional demo key for the live price fill

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
